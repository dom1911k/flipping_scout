[project]
name = "resell-toolkit"
version = "0.1.0"
description = "Local sourcing, margin and buyer-reply tools for an electronics reselling side business"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "openpyxl>=3.1",
  "typer>=0.12",
  "pyyaml>=6",
  "pydantic>=2.5",
  "jinja2>=3.1",
  "matplotlib>=3.8",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
resell = "resell.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["resell", "resell.importers"]

[tool.setuptools.package-data]
resell = ["schema.sql", "templates/*.j2"]
