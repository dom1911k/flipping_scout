# resell-toolkit configuration. Everything tunable lives here.

paths:
  workbook: data/Orders_and_cost_breakdown.xlsx   # read-only input
  db: data/resell.db
  reports: reports

# ---------------------------------------------------------------- Phase 0
sales_sheet: "Sales Sheet"
order_sheet_prefix: "Order #"

stock_aging_days: 120          # flag unsold stock older than this
report_as_of: null             # null = today; or "2026-10-16"

# Category rules: first match wins (case-insensitive regex on the item name).
# Order matters: grips before N3DS ("Hori 3DS grip"), Vita cards before consoles.
categories:
  - {name: Grip,      pattern: '\bgrip\b'}
  - {name: Vita card, pattern: '(vita|psv).*(card|sd|\b\d+\s*g)'}
  - {name: N3DS,      pattern: 'n3ds|3ds\s*(ll|xl)|new\s*3ds'}
  - {name: iPod,      pattern: 'ipod'}
  - {name: Bluetooth, pattern: 'bluetooth|ugreen'}
  - {name: Camera,    pattern: 'olympus|mju|camera|\bvf\d'}
  - {name: DDR5,      pattern: 'ddr5'}
  - {name: AYN,       pattern: '\bayn\b|\bthor\b|\bodin'}
  - {name: GB/GBA,    pattern: '\bgb[acp]?\b|gameboy|game boy|\bgbasp\b|\bsp\b'}
  - {name: Other,     pattern: '.'}

# Grade = condition number sellers use ("white 98" = 98% new). Only 80-99 count.
grade_min: 80
grade_max: 99

# Flaw detection on item name + comment. A row is "flawed" if any group matches
# and no negation pattern covers that match. Groups are reported separately.
flaw_keywords:
  dust_debris: [dust, staub, hair, haar, spider, webs, krümel, flecken, particle,
                smudge, "stuff under", "weird under", debris, "weird marks", "weird traces"]
  yellow:      [yellow, gelb, tint, tinge]
  scratch:     [scratch, scatch, kratzer, "screen glass"]
  screen:      [pixel, "burn in", dim, "screen defect", "corners slightly black",
                blackened, spotted, "upper panel is tn"]
  shell_serial: [reshell, "fake serial", "serial code clearly fake", "sn mismatch",
                 "code mismatch", "serial not matching", "rough outer shell",
                 "shell pretty rough", "not fully closable", "opened it"]
  function:    ["not working", "doesn't work", "not responding", defect, broken,
                drift, "barely works", "only if pressed", "not as clicky", "weak wifi",
                "power issues", "audio issues", "not turning on", "doesn't charge",
                "quite slow", rigid, "difficult to turn", corrupted, "c stick is weird",
                "weird b button", "weird noise", "smoke came out"]
  odor:        [smoke stench, "smoke smell", stench, smell]
  wrong_item:  ["instead of", scammed, "dual tn"]
# Words in the same clause that mark a flaw as minor (sold at or near normal price).
flaw_minor_words: [slight, slightly, tiny, small, maybe, "a little", minor, "just scatches on foil"]
# Remarks that also count when they follow in the next clause: "Yellow corners (not too bad - wont mention)"
flaw_minor_followups: ["not too bad", "wont mention", "might mention", "only on foil"]
# Flaw groups that are never downgraded to "minor", however the comment is worded.
flaw_always_major: [yellow, dust_debris]
# Comments that mention a keyword but are not arrival flaws.
flaw_negations: ["no dust", "kein staub", "no scratches", "keine kratzer",
                 "no screen protector", "immaculate"]
# Manual corrections after you review the report: sheet row number -> true/false
flaw_overrides: {}

# Units that were lost in transit / never arrived (sheet rows). Counted as a loss in totals,
# left out of sell-price, days-to-sell and flaw statistics.
lost_rows: [173, 174]

# Seller resolution. The Source column holds shop names (2024-25), then Goofish
# links or listing titles. "dif seller" in the item name means "not my main seller".
main_seller: "任子隆批发零售折扣店"
dif_seller_markers: ["dif seller", "different vendor", "different seller"]
non_seller_sources: ["JP + CN Sources", "Random Xianyu Source", "Forgot", ""]
# From this date on, N3DS rows without a "dif seller" marker and without other seller
# evidence are attributed to main_seller (marked confidence = "inferred").
dif_seller_convention_since: "2025-09-01"

# Selling Place normalisation: value -> platform / account
platforms:
  "Kleinanzeigen": {platform: Kleinanzeigen}
  "Ebay Dom":      {platform: eBay, account: Dom}
  "Ebay Risa":     {platform: eBay, account: Risa}
  "Ebay Laura":    {platform: eBay, account: Laura}
  "Vinted Dom":    {platform: Vinted, account: Dom}
  "Willhaben":     {platform: Willhaben}
  "Privat":        {platform: Private}
  "Discord":       {platform: Private}
  "David":         {platform: Private}

ebay_account_revenue_cap_eur: 2000   # per account per calendar year (your own rule)

# ---------------------------------------------------------------- Phase 1: landed cost & calculator
costs:
  # What you actually pay per € when buying RMB. This value always wins; the calculator only shows
  # the live ECB rate and your recent order median next to it as a hint.
  # Phase 0: 8.30 in Aug-Oct 2025, 7.60 in Oct 2026.
  rmb_per_eur_effective: 7.6
  agent_fee_per_item_eur: 0.5          # Superbuy add/service fee per item (sometimes 0-1)

  # International shipping: weight x rate, never below the minimum. Weights per category below.
  shipping_eur_per_kg: 22.0
  shipping_min_eur: 1.0

  # Import (EU, since 1 Jul 2026): consignments <= EUR 150 pay a flat EUR 3 per tariff line instead of
  # duty; above that the normal duty rate applies. Import VAT (EUSt) is charged on goods + shipping + duty.
  customs_flat_per_tariff_line_eur: 3.0
  customs_flat_threshold_eur: 150
  import_vat_rate: 0.19
  # Your order sheets have no EUSt line, so it's off for the categories you already buy, and ON for
  # anything new, so estimates for new categories are never rosier than reality.
  # Flip per category in category_profiles (import_vat: true/false).
  import_vat_default: true

  # Selling side, per platform. Private sales on eBay.de and Kleinanzeigen to German buyers have no
  # seller fee (checked Oct 2026: eBay.de private sellers pay no final value or insertion fee since
  # 2023; paid upgrades/promotions are extra). Vinted fees are paid by the buyer.
  platforms_sell:
    kleinanzeigen: {fee_pct: 0.0, fee_fixed_eur: 0.0, outbound_shipping_eur: 0.0}
    ebay:          {fee_pct: 0.0, fee_fixed_eur: 0.0, outbound_shipping_eur: 6.0}
    vinted:        {fee_pct: 0.0, fee_fixed_eur: 0.0, outbound_shipping_eur: 0.0}
  default_platform: kleinanzeigen

# Targets for the calculator and the reverse "max RMB" mode.
targets:
  min_profit_eur: 50            # criterion 5: profit >= EUR 50-100 per item...
  good_profit_eur: 100
  min_profit_on_cost: 0.50      # ...and >= 50% profit on what you paid
  min_profit_on_cost_borderline: 0.40   # 40-50% on cost with enough profit = BORDERLINE, not FAIL
  cheap_item_max_cost_eur: 40   # cheap/fast/low-risk exception
  cheap_item_min_profit_eur: 20
  cheap_item_max_days: 90
  hype_trend_fail: -0.10        # 12-month sell-price change below -10% = hype/declining
  hype_trend_ok: -0.03          # better than -3% = flat or rising
  history_months: 12            # window for the median sell price from your own sales

# What you know about each category, for the 5-criteria score. Anything not listed is treated as unknown.
#  discontinued: no longer manufactured (true/false)
#  hype: you left it on purpose because it was hype-driven (forces criterion 2 to FAIL)
#  china_edge: modded | refurbished | arbitrage | none
#  testability: easy | medium | hard   (hard = can't verify from photos / test in minutes)
category_profiles:
  N3DS:      {weight_kg: 0.40, returns_reserve_pct: 0.05, import_vat: false, discontinued: true, china_edge: modded, testability: easy}
  iPod:      {weight_kg: 0.22, returns_reserve_pct: 0.03, import_vat: false, discontinued: true, china_edge: modded, testability: easy}
  Vita card: {weight_kg: 0.03, returns_reserve_pct: 0.02, import_vat: false, discontinued: true, china_edge: arbitrage, testability: easy}
  Bluetooth: {weight_kg: 0.05, returns_reserve_pct: 0.02, import_vat: false, discontinued: false, china_edge: arbitrage, testability: easy}
  Grip:      {weight_kg: 0.25, returns_reserve_pct: 0.02, import_vat: false, discontinued: true, china_edge: arbitrage, testability: easy}
  Camera:    {weight_kg: 0.30, returns_reserve_pct: 0.08, discontinued: true, china_edge: arbitrage, testability: hard}
  DDR5:      {weight_kg: 0.15, returns_reserve_pct: 0.03, discontinued: false, hype: true, china_edge: arbitrage, testability: medium}
  AYN:       {weight_kg: 0.80, returns_reserve_pct: 0.03, discontinued: false, hype: true, china_edge: arbitrage, testability: easy}
  GB/GBA:    {weight_kg: 0.25, returns_reserve_pct: 0.05, discontinued: true, china_edge: modded, testability: easy}

# ---------------------------------------------------------------- Phase 3: Kleinanzeigen reply helper
replies:
  factsheets: data/factsheets.yaml       # your listings (gitignored); `resell replies-init` copies the example
  profile: data/seller_profile.yaml      # name, area, pickup address, PayPal (gitignored)
  use_llm: true                          # only if ANTHROPIC_API_KEY is set; otherwise templates
  llm_model: claude-opus-5-5
  llm_effort: low
  negotiation:
    round_to: 5              # counters land on 5s: 280, 285 ...
    first_step_pct: 0.07     # "what's your best price?" -> asking minus ~7% (300 -> 280)
    accept_within: 5         # accept an offer if a fair counter would be within €5 of it
    lowball_pct: 0.80        # below 80% of the floor = lowball: polite no + your floor

# ---------------------------------------------------------------- Phase 4: category research
research:
  # Rough conversion for pasted USD/GBP sold prices (EUR and CNY are handled already). Update now and then.
  fx_to_eur: {USD: 0.86, GBP: 1.15}
  # Spec 4e quick mode for scouting: landed = RMB / rate + fixed_eur;
  # max price = (min(sell - target_profit, sell / (1 + target_markup)) - fixed_eur) x rate
  quick:
    rate: null                 # null = costs.rmb_per_eur_effective
    fixed_eur: 10
    target_profit_eur: 50
    target_markup: 0.5
  browse_discount: 0.15        # eBay asking median -> estimated sell price when no sold data exists
  discovery_classes: [handheld_console, retro_console, portable_audio, headphones, camera]
  recordings:
    model: claude-opus-5-5     # Claude vision reads the frames
    effort: medium
    frames_per_request: 4      # fewer = smaller answers; more = fewer requests
    max_frames: 90             # ~1.5 min of scrolling at 1 frame/s after de-duplication
    cache_dir: data/recordings
    price_per_mtok_usd: {input: 4.0, output: 20.0}   # for the cost line in the report
  ebay:                        # Browse API (official). Credentials in .env: EBAY_CLIENT_ID / EBAY_CLIENT_SECRET
    marketplace: EBAY_DE
    country: DE                # the "de" scope filters on item location; "eu" runs without it
    condition: USED
    max_items: 600             # per candidate and scope (3 pages of 200); disappearance tracking needs all matches
    pause_seconds: 0.5
    cache_dir: data/ebay_cache
