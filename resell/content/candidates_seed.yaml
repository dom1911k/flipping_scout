# Starting point for the research workspace (`resell research seed` inserts these once; edit in the UI).
# Findings come from a first web research pass (Oct 2026). Each finding names its source; things the
# pass could NOT confirm say so. Criteria: 1 discontinued, 2 not hype, 3 China version better,
# 4 easy to verify and test, 5 profit. 0 = general.

candidates:
  - id: n3ds
