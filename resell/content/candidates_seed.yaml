# Starting point for the research workspace (`resell research seed` inserts these once; edit in the UI).
# Findings come from a first web research pass (Oct 2026). Each finding names its source; things the
# pass could NOT confirm say so. Criteria: 1 discontinued, 2 not hype, 3 China version better,
# 4 easy to verify and test, 5 profit. 0 = general.

candidates:
  - id: n3ds
    name: New 3DS XL dual IPS (benchmark)
    calc_category: N3DS
    own_sales_match: "n3ds"
    status: active
    discontinued: "New 3DS XL production ended 2019-2020"
    china_edge: modded
    testability: easy
    weight_kg: 0.40
    keywords_zh: "new3dsll 双ips"
    keywords_eu: "New 3DS XL dual IPS"
    notes: "Your main category - here as the yardstick the candidates are compared against."
