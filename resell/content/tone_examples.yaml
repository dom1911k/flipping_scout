# Your own past replies (names, address and email replaced by placeholders). Used as style examples
# for the optional LLM drafts. Add more any time.
examples:
  - buyer: "Hi, ich bin interessiert. Wo in Berlin hältst du dich auf und könnte ich ihn gemoddet übernehmen?"
    me: "Hey! Ich wohne nahe {area} und klar, würde den so gemodded übergeben.\nViele Grüße"
  - buyer: "Okay cool, bist du heute zwischen 19 und 20 uhr da und würde bezahlung via paypal freunde gehen? Ah und womit ist sie gemoddet? Homebrew?"
    me: "Der 3DS ist mit Luma gemodded.\nJa bin heute zu der Zeit zuhause und Paypal Freunde wäre kein Problem.\n\nMeine Adresse:\n{address}"
  - buyer: "Hallo, ich würde den iPod gerne vor Ort abholen. Was wäre dein letzter Preis bei Barzahlung / Abholung? Viele Grüße"
    me: "Hi {name},\nWäre bereit auf 210 bei Abholung zu gehen.\nViele Grüße,\n{sign}"
  - buyer: "Hi! Kurz eine Frage zum Akku: Wie viele Stunden Musik bzw. Video-Wiedergabe schafft der 1800 mAh Akku ungefähr mit einer Ladung?"
    me: "Hab den nie komplett durchlaufen lassen aber es sind schon locker 20-30 Stunden Musik. Video denk ich vlt die Hälfte oder etwas weniger"
  - buyer: "Super, vielen Dank! Wären 190 € bei spontaner Abholung heute auch noch machbar? Ich könnte flexibel vorbeikommen"
    me: "Mh also 200 würde ich noch machen aber das wäre wirklich das Letzte."
  - buyer: "Guten Abend, ich bin sehr interessiert in die Konsole und wollte fragen, ob wir uns treffen könnten, damit ich es mir ansehen kann :)"
    me: "Hi {name},\ndie Konsole ist leider weg aber hab eine sehr ähnliche in rot hier, die ich jetzt verkaufen möchte.\nHat auch 64GB Speicher, dual IPS und hat Spiele vorinstalliert.\nWie sieht es zeitlich morgen bei dir aus?"
  - buyer: "Hallöchen, ist es noch zu haben? LG"
    me: "Hallo, ja ist noch zu haben\nViele Grüße"
  - buyer: "Auf dem Bild sind die Spiele zu sehen sind die auch mit dabei?"
    me: "Genau, sind alle vorinstalliert und kann einfach mehr runtergeladen werden."
  - buyer: "Ich hätte Interesse. Passt es morgen vorbeizukommen?"
    me: "Ja morgen passt es gut, wie sieht es gegen 12 Uhr aus?\nAdresse ist\n{address}"
  - buyer: "Moin, am Preis ist definitiv nichts mehr machbar? Gruß"
    me: "Hey, wäre bereit auf 280 zu gehen inkl Versand.\nViele Grüße\n{sign}"
  - buyer: "Hi, klingt fair. Wäre auch Zahlung per Paypal Waren & Dienstleistungen möglich, wenn ich die Gebühren übernehme?"
    me: "Können wir gerne so machen. Meine PayPal Adresse ist {paypal}\nBräuchte dann bitte die Adresse an die ich es senden soll.\nViele Grüße"
  - buyer: "Hallo, kannst du an dem Preis noch was machen?"
    me: "Hey! Wäre bereit auf 280 zu gehen.\nViele Grüße"
  - buyer: "Hallo! Ich habe großes Interesse an der Kamera. Ist sie noch verfügbar?"
    me: "Hey, die Person die sie abholen wollte meldet sich nicht daher würde ich sie als verfügbar bezeichnen :)\nViele Grüße"
  - buyer: "Wollte mal nachfragen was preislich noch so möglich wäre & für was der Farbton Rainbow genau steht wenn der Thor grau ist?"
    me: "Hi {name}, Preis wäre Festpreis. Wäre aber bereit den Versand zu übernehmen. Rainbow daher, weil die AB/XY Tasten Regenbogenfarbend sind aber ja, die Konsole ist an sich komplett grau :)\nViele Grüße,\n{sign}"
